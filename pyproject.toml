[project]
name = "qa-api"
version = "0.1.0"
description = "API-service for questions and answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.1",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.121.1",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
    "pre-commit>=3.5.0",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
