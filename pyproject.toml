[project]
name = "qa-api"
version = "0.1.0"
description = "API-service for questions and answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.1",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.121.1",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "loguru>=0.7.3",
    "pytest>=9.0.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
    "pre-commit>=3.5.0",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "--verbose",
    "--color=yes",
    "--strict-markers", 
    "--strict-config",
]
markers = [
    'slow: marks tests as slow (deselect with "-m not slow")',
    "integration: marks tests as integration tests",
]

[tool.ruff]
output-format = "concise"
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "S",
    "D",
    "ANN",
    "FBT",
]
ignore = [
    "B008",
    "S101",
    "D203",
    "D212",
]

[tool.ruff.lint.per-file-ignores]
'**/__init__.py' = ["F401"]
'**/migrations/versions/*.py' = ["D400", "D415", "E501", "W291"]

[lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false