output-format = "concise"

line-length = 88

target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "S",
    "D",
    "ANN",
    "FBT",
]

ignore = [
    "B008",
    "S101",
    "D203",
    "D212",
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[lint.flake8-bandit]
check-typed-exception = true